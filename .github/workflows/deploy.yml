name: Build Astro site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and build site
        uses: withastro/action@v4
        with:
          node-version: 22
          package-manager: pnpm@latest